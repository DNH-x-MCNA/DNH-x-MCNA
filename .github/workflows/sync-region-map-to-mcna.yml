name: Sync bang tien to vung mien sang DNH-x-MCNA

# Tu dong mo Pull Request sang repo DNH-x-MCNA moi khi CUSTOMER_CODE_PREFIX_TO_REGION trong
# src/region_map.py thay doi tren nhanh main. KHONG gop code 2 repo lam 1 - chi dong bo dung 1
# phan "su that nghiep vu" da kiem chung (bang tien to ma khach hang -> vung mien), tranh 2 repo
# tu viet lai roi lech nhau nhu vu HCM13508 (xem docs/Cau_hoi_can_DNH_chot_truoc_hop_16-07.md muc 5
# va lich su commit region_map.py).
#
# CAN THIET LAP 1 LAN: secret SYNCDNH (Settings -> Secrets and variables -> Actions cua repo nay) -
# Personal Access Token (classic, scope "repo") co quyen push + tao PR tren uwhrgoWI/DNH-x-MCNA.

on:
  push:
    branches: [main]
    paths:
      - "src/region_map.py"
  workflow_dispatch: {}  # cho phep bam chay tay tu tab Actions de test

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout D:\DNH (nguon)
        uses: actions/checkout@v4
        with:
          path: dnh

      - name: Checkout DNH-x-MCNA (dich)
        uses: actions/checkout@v4
        with:
          repository: uwhrgoWI/DNH-x-MCNA
          token: ${{ secrets.SYNCDNH }}
          path: mcna
          ref: master

      - name: Va bang tien to vao backend/region_map.py
        run: python dnh/scripts/sync_customer_prefix_table.py mcna/backend/region_map.py

      - name: Tao branch + commit + mo PR neu co thay doi
        working-directory: mcna
        env:
          GH_TOKEN: ${{ secrets.SYNCDNH }}
        run: |
          if git diff --quiet backend/region_map.py; then
            echo "Khong co thay doi can dong bo."
            exit 0
          fi
          git config user.name "dnh-sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          BRANCH="sync/region-prefix-table-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add backend/region_map.py
          git commit -m "Sync: cap nhat bang tien to vung mien tu D:\\DNH (tu dong)"
          git push origin "$BRANCH"
          gh pr create --repo uwhrgoWI/DNH-x-MCNA \
            --title "Sync: cap nhat bang tien to vung mien tu D:\\DNH" \
            --body "Tu dong dong bo CUSTOMER_CODE_PREFIX_TO_REGION tu commit ${{ github.sha }} cua D:\\DNH (src/region_map.py). Vui long review truoc khi merge - script chi thay dung khoi bang tien to, khong dong den phan con lai cua file."
