# Cấu hình các ngưỡng cảnh báo (Warning Thresholds)
thresholds:
  erp:
    low_inventory_limit: 20       # Cảnh báo khi số lượng tồn kho < 20
    failed_orders_limit: 5        # Cảnh báo khi số lượng đơn lỗi/hủy trong 1 giờ qua > 5
    failed_orders_lookback_hours: 1
  crm:
    unresolved_urgent_tickets_limit: 3  # Cảnh báo khi số ca Urgent/Open > 3
  business:
    revenue_drop_pct: 0.20        # Doanh thu tháng mới nhất giảm > 20% so với tháng liền trước
    # comparison_mode: "mom"      # mom = so tháng liền kề (đang dùng); "yoy" = cùng kỳ năm trước (chờ DNH chốt)
    # 16/07/2026: tách riêng theo kênh thay vì 1 ngưỡng chung 35% — thực tế (đã loại rác dữ liệu
    # <50k) OTC ~93%, ETC ~81%, ngưỡng cũ luôn bị vi phạm nên mất tác dụng cảnh báo. Vẫn TẠM THỜI,
    # chờ DNH xác nhận date-basis chính thức (xem skill dnh-debt-aging-schema) mới chốt lại.
    overdue_ratio_pct_otc: 0.80   # Kênh OTC: nợ quá hạn/tổng dư nợ vượt 80%
    overdue_ratio_pct_etc: 0.65   # Kênh ETC: nợ quá hạn/tổng dư nợ vượt 65%
    dead_stock_months: 12.0       # Tồn "chết": months_to_sell >= 12 tháng
    dead_stock_min_value: 50000000    # ...và giá trị tồn > 50 triệu (mới đáng cảnh báo vốn đọng)
    customer_churn_drop_pct: 0.50 # Khách lớn: doanh số tháng mới nhất rớt > 50% so tháng trước
    customer_churn_min_prev: 50000000 # ...và tháng trước từng mua > 50 triệu (mới coi là "khách lớn")
    concentration_top_n: 3        # Rủi ro tập trung: top N khách...
    concentration_pct: 0.50       # ...chiếm > 50% tổng doanh thu kỳ
    return_rate_pct: 0.05         # Tỷ lệ giá trị hàng trả về / doanh số ETC vượt 5%
    etl_stale_hours: 3            # Meta-alert: dữ liệu (MAX SyncAt) không mới quá 3 giờ -> nghi ETL đứng

    # Nhịp KPI theo NGÀY của từng TDV (doanh số phát sinh trong ngày / chỉ tiêu THÁNG của chính
    # TDV đó) — chỉ khả thi kênh OTC (brvsx_hoadonhdr/ETC không có cột nhân viên trên hóa đơn).
    # Xem check_daily_kpi_pace_alert()/check_kpi_milestone_drop_alert() trong src/alerts.py.
    kpi_pace_red_pct: 3.0            # < 3% doanh số ngày/chỉ tiêu tháng -> Đỏ
    kpi_pace_yellow_pct: 4.0         # 3% - <4% -> Vàng; >=4% -> Xanh
    kpi_pace_red_alert_count: 5      # >= 5 TDV đỏ trong ngày -> gửi alert
    kpi_milestone_drop_pct: 0.05     # giảm > 5% tại mốc ngày 10/20 so với TB 5 tháng trước -> alert
    kpi_milestone_lookback_months: 5 # số tháng liền trước dùng để tính trung bình

    # 16/07/2026: đối chiếu doanh thu OTC (hóa đơn Bravo) với bảng KPI tháng hiện tại, cộng theo
    # DISTINCT khách hàng (miễn nhiễm lỗi gắn cờ IsDuplicate ở bất kỳ cấp nhân viên nào) — xem
    # check_kpi_revenue_reconciliation_alert. Verify khớp TUYỆT ĐỐI (lệch = 0 đồng, 4/4 tháng
    # test). ZERO-TOLERANCE theo yêu cầu — lệch dù chỉ 1 đơn/1 đồng cũng phải báo, KHÔNG có vùng
    # đệm nào (0 = tắt hẳn dung sai, không phải "gần như tắt").
    kpi_reconciliation_tolerance_vnd: 0
    kpi_milestone_min_prev: 10000000 # TB lũy kế 5 tháng trước phải > 10 triệu mới xét (tránh chia ~0)

  # Ngưỡng KPI nhân sự khối kinh doanh OTC MIỀN NAM — trích từ QĐ 0429-2/QĐ-HĐQT.25 (5 phụ lục:
  # TDV, TDV chợ sỉ, Trưởng kênh MT, Trưởng bộ phận, Trưởng phòng). position_code CS/TK suy luận
  # từ số lượng nhân viên thực tế (dim_nhanvien, AreaCode='MN'), CHƯA có bảng chú giải chính thức
  # từ HR — xác nhận lại trước khi coi các số dưới đây là cuối cùng.
  kpi_sales_force:
    contract_risk_pct:      # 2 tháng liên tiếp doanh số/target <= ngưỡng -> công ty có quyền chấm
                             # dứt HĐLĐ. LƯU Ý: kpi_summary không lưu lịch sử theo tháng, nên code
                             # chỉ kiểm tra được THÁNG HIỆN TẠI (cảnh báo sớm), CHƯA xác nhận đủ
                             # điều kiện chính thức "2 tháng liên tiếp".
      TDV: 0.65
      CS: 0.65
      TK: 0.60
      TBP: 0.70
      TP: 0.70
    quarter_zero_bonus_pct: 0.80  # <80% quý/target quý -> hệ số thưởng quý = 0% (chung cả 5 vai trò)
    year_floor_pct: 0.75          # <75% năm/target năm -> hệ số thưởng năm = 0%, mức sàn (chung cả 5 vai trò)

# Tuổi nợ (debt aging bucket) trên Bravo — xem skill dnh-debt-aging-schema. "Ngày cơ sở" (date_basis)
# để tính số ngày quá hạn CHƯA được DNH xác nhận chính thức (open item từ khảo sát 07/07/2026, từng
# gây tranh cãi hợp đồng ở bản thử nghiệm đầu — KHÔNG tự đổi giá trị này mà không hỏi lại DNH trước).
# date_basis="doc_date_plus_term": hạn thanh toán = DocDate + số ngày công nợ (DueDate trên
# BRV_HTTDuDK/BRVSX_HTTDuDK) — lựa chọn TẠM THỜI, phổ biến nhất trong kế toán nhưng CHƯA xác nhận.
# provisional=true: bắt buộc chatbot luôn cảnh báo số liệu tuổi nợ là tạm thời trong mọi câu trả lời.
debt_aging:
  date_basis: "doc_date_plus_term"
  provisional: true

# Bật/tắt các trigger đang bị DATA GAP (thiếu cột nguồn) — tắt để đỡ tốn 1 query Supabase mỗi
# chu kỳ quét cho việc chỉ để in "chưa có dữ liệu". Bật lại (đổi thành true) ngay khi DNH bổ
# sung cột nguồn tương ứng vào mart, KHÔNG cần sửa code.
alert_feature_flags:
  credit_limit_check: false   # cần cột hạn mức tín dụng trong dms_khachhang/receivable_detail
  near_expiry_check: false    # cần cột ExpiryDate lô hàng (map lô -> hạn dùng) trong mart tồn kho
  etl_freshness_check: false  # TẠM TẮT: đang trỏ CLOUD_DB_URL sang Supabase dev/test (snapshot
                               # tĩnh, SyncAt không tăng) -> bật lại true khi đổi CLOUD_DB_URL về production
  kpi_sales_force_risk_check: false  # 16/07/2026: VẪN TẮT — lý do tắt cũ ("kpi_summary 100% miền
                                      # Bắc") đã không còn đúng (nhánh Bravo chính đã có đủ dữ liệu
                                      # Miền Nam/Trung, xác nhận thực tế 16/07: 33 nhân sự vi phạm,
                                      # 7 người đủ điều kiện "2 tháng liên tiếp" — xem
                                      # get_bravo_last_n_complete_months), NHƯNG đây là cảnh báo nêu
                                      # đích danh nhân sự có nguy cơ chấm dứt HĐLĐ gửi lên Teams —
                                      # cần XÁC NHẬN RÕ RÀNG RIÊNG từ người dùng trước khi bật thật,
                                      # không tự ý bật cùng lúc với việc sửa logic 2-tháng-liên-tiếp.

# Cấu hình Chu kỳ chạy (giây hoặc phút)
# LƯU Ý: cảnh báo thời gian thực chính nay trigger ngay sau mỗi lần đồng bộ Bravo (xem
# scripts/sync_from_bravo_to_supabase.py), không còn phụ thuộc chu kỳ poll dưới đây — vòng lặp
# DNH_Realtime_Alerts (main.py) chỉ còn vai trò lưới an toàn dự phòng nên có thể để chu kỳ dài.
# Báo cáo Daily/Weekly/Monthly cũng đã tách sang scheduled task riêng
# (scripts/register_digest_schedule.bat: DNH_Daily_Digest_1745 17:45 hàng ngày,
# DNH_Weekly_Report thứ Bảy 18:00, DNH_Monthly_Report ngày 1 hàng tháng 17:45) — 2 dòng cấu hình
# daily_digest_time/weekly_digest_day bên dưới không còn được main.py đọc nữa, giữ lại chỉ để
# tham khảo giờ đang đăng ký trong Task Scheduler.
scheduler:
  etl_check_interval_seconds: 3600  # Quét dự phòng mỗi 1 giờ — lưới an toàn, không phải nguồn trigger chính
  daily_digest_time: "17:45"        # Tham khảo — giờ thật đăng ký trong DNH_Daily_Digest_1745
  weekly_digest_day: "Saturday 18:00"       # Tham khảo — giờ thật đăng ký trong DNH_Weekly_Report

  # 15/07/2026: chỉ gửi cảnh báo nghiệp vụ thời gian thực (Teams) trong giờ hành chính — trước đó
  # vòng lặp dự phòng (etl_check_interval_seconds, chạy 24/7 không phân biệt giờ) vẫn bắn cảnh báo
  # CRITICAL lúc nửa đêm/rạng sáng (vd 23:09, 00:10, 05:19), gây phiền vô ích ngoài giờ làm việc.
  # Áp dụng cho run_all_alert_checks() nói chung (cả nhánh trigger theo lịch đồng bộ Bravo lẫn vòng
  # lặp dự phòng) — ngoài khung giờ này, TOÀN BỘ chu kỳ quét bị bỏ qua (không đánh giá, không ghi
  # nhận đã gửi), để lần quét tiếp theo TRONG giờ hành chính tự đánh giá lại từ đầu, không mất
  # cảnh báo thật nào, chỉ trì hoãn tới giờ làm việc. KHÔNG ảnh hưởng Daily/Weekly/Monthly Digest
  # (chạy qua scheduled task riêng, đã tự trong giờ hành chính sẵn).
  alert_business_hours_start: "08:00"
  alert_business_hours_end: "18:00"
  alert_business_days: [1, 2, 3, 4, 5]  # 1=Thứ 2 ... 7=Chủ nhật (ISO weekday) — hiện T2-T6
