# Cấu hình hệ thống Pipeline ETL & Cảnh báo

# Môi trường chạy: 'local' (bật thêm bộ cảnh báo MOCK ERP/CRM giả lập, chỉ để dev test — KHÔNG
# dùng khi đã có webhook Teams/Telegram thật vì mock sẽ gửi dữ liệu giả vào kênh thật) hoặc
# 'production' (chỉ chạy cảnh báo nghiệp vụ thật đọc từ Supabase, tắt hẳn mock).
environment: production

# Cấu hình Cơ sở dữ liệu
database:
  # Cấu hình cho môi trường local (SQLite)
  local:
    erp_connection_string: "sqlite:///mock_source/erp.db"
    crm_connection_string: "sqlite:///mock_source/crm.db"
  
  # Cấu hình cho môi trường production (SQL Server)
  # Lưu ý: Các trường ${DB_PASS} sẽ được tự động load từ file .env
  production:
    erp_connection_string: "mssql+pyodbc://{DB_USER}:{DB_PASS}@{DB_HOST}:{DB_PORT}/{ERP_DB_NAME}?driver=ODBC+Driver+17+for+SQL+Server"
    crm_connection_string: "mssql+pyodbc://{DB_USER}:{DB_PASS}@{DB_HOST}:{DB_PORT}/{CRM_DB_NAME}?driver=ODBC+Driver+17+for+SQL+Server"

# Cấu hình thông báo Email (Outlook SMTP)
# Lưu ý: Mật khẩu email được lấy từ biến môi trường SMTP_PASSWORD trong file .env
email:
  smtp_server: smtp.office365.com
  smtp_port: 587
  use_tls: true
  sender_name: "Alerting System (ETL)"
  sender_email: "" # Điền email gửi (Outlook) của bạn vào đây hoặc trong .env
  recipient_emails:
    - "" # Email người nhận cảnh báo, ví dụ: user@example.com

# Phân quyền theo cấp quản lý — NGUỒN DUY NHẤT định nghĩa 6 audience, dùng chung cho CẢ BA kênh:
#   - Email báo cáo Weekly/Monthly (main.py::send_weekly_report/send_monthly_report, lặp qua
#     danh sách này, gửi riêng từng audience). Daily digest KHÔNG đổi, vẫn gửi 1 bản chung tới
#     email.recipient_emails ở trên.
#   - Alert Teams thời gian thực (src/notifier.py::send_alert_to_all_channels) — mỗi alert có
#     region=/channel= sẽ gửi tới webhook của MỌI audience khớp phạm vi (xem
#     _resolve_teams_webhooks). teams_webhook để trống ("") = CHƯA có Flow/webhook riêng cho
#     audience này -> tạm dùng chung TEAMS_WEBHOOK_URL trong .env (vẫn 1 webhook chung như cũ,
#     không có tác dụng phân tách thật cho tới khi điền webhook riêng). Điền URL Power Automate
#     riêng cho từng audience vào đây khi đã dựng xong Flow tương ứng — KHÔNG cần sửa code.
