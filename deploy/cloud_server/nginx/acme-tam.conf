# CHI dung LAN DAU, truoc khi co chung chi: nginx khong khoi dong duoc neu ssl_certificate tro toi file
# chua ton tai, nen cai_dat_lan_dau.sh bat file nay de certbot lay chung chi, roi thay bang
# chatbot.namhatrading.com.conf. Khong de file nay chay lau dai.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name chatbot.namhatrading.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}
