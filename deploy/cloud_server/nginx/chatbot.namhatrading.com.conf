# Web chatbot DNH tren Cloud Server Mat Bao - /etc/nginx/sites-available/chatbot.namhatrading.com.conf
# Sua trong repo (deploy/cloud_server/nginx) roi cai lai bang cai_dat_lan_dau.sh; KHONG sua tay tren server.
# Kiem cu phap: sudo nginx -t. Can nginx >= 1.19.4 (ssl_reject_handshake) - Ubuntu 24.04 co 1.24.
#
# Chi Nginx nghe cong public. Web Next.js nghe 127.0.0.1:3000 (dnh-web.service), backend nam tren may 24,
# web goi qua duong ham WireGuard - trinh duyet khong bao gio thay dia chi backend.

# Truy cap bang IP tran / ten mien khac: dong ket noi, khong lo trang nao.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name chatbot.namhatrading.com;

    # Let's Encrypt kiem ten mien qua HTTP (certbot --webroot); con lai chuyen sang HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chatbot.namhatrading.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/chatbot.namhatrading.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot.namhatrading.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DNH_SSL:10m;
    ssl_session_tickets off;

    # Khong includeSubDomains: chi ap cho dung ten chatbot, khong dung toi cac ten khac cua namhatrading.com.
    # Header bao mat con lai (CSP frame-ancestors, X-Frame-Options...) do next.config.ts dat.
    # KHONG dat add_header trong cac location ben duoi: nginx se bo toan bo add_header cap server.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cau hoi/chat chi vai KB; khong co chuc nang tai file len.
    client_max_body_size 1m;

    # CHONG DO MAT KHAU: src/app/api/_proxy.ts (clientIpHeaders) lay IP nguoi dung tu x-real-ip, roi
    # x-forwarded-for, va chuyen cho backend lam khoa gioi han dang nhap sai. Hai header nay phai la GHI DE
    # bang IP ket noi that - KHONG dung $proxy_add_x_forwarded_for (noi them vao gia tri trinh duyet tu gui,
    # nguoi dung doi IP gia moi lan la ne duoc gioi han).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Tra loi dang stream (SSE): tat buffer de chu hien dan, tang timeout vi cau nang co the chay vai phut.
    location = /api/chat/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        # /api/chat (khong stream) cho het cau tra loi moi tra ve.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
