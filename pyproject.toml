[project]
name = "dnh-portal"
version = "1.0.0"
description = "Dược Nam Hà Portal & AI Chatbot"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

# 12/08/2026: `pytest -q` tu goc repo KHONG BAO GIO KET THUC. Nguyen nhan KHONG phai test hong:
# khong co testpaths nen pytest quet ca cay thu muc va IMPORT moi file ten test_*.py no gap.
# Trong so do co cac file thu nghiem chay viec NANG NGAY LUC IMPORT (khong nam trong ham test),
# vd scratch/test_bravo_conn.py mo socket toi SQL Server Bravo, scratch/test_chatbot_once.py goi
# API - may dev khong toi duoc Bravo nen treo o timeout mang, cong don qua 29 file.
# Gioi han vao dung thu muc tests/ (29 test, thu thap 3,3 giay). Cac file test_*.py trong
# scratch/ va bao-cao-canh-bao/ la script chay tay, khong phai test tu dong.
#
# Nguyen nhan thu HAI (doc lap voi tren): test_chay_dry_run_tat_ca_audiences goi send_daily_digest()
# - du la dry_run, no van DUNG bao cao that nen phai truy van du lieu; may khong toi duoc DB thi TREO
# o timeout mang chu khong fail. 28 test con lai xong trong ~3 giay, rieng test nay treo vo han.
# -> danh dau `integration` va loai khoi lan chay mac dinh. Chay tren may CO du lieu (may 24):
#        pytest -m integration
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scratch", "bao-cao-canh-bao", "node_modules", ".next", ".git", "frontend", "scripts"]
markers = ["integration: can ket noi DB/mang that - loai khoi lan chay mac dinh"]
addopts = "-m 'not integration'"
